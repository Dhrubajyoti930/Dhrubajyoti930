<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    .bg { fill: #0b0f19; }
    
    /* Spaceship floating effect */
    @keyframes hover {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    
    /* Star engine flame flicker */
    @keyframes flicker {
      0%, 100% { opacity: 0.8; transform: scaleX(1); }
      50% { opacity: 1; transform: scaleX(1.3); }
    }
    
    /* Passing stars animation */
    @keyframes streak {
      0% { transform: translateX(850px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(-50px); opacity: 0; }
    }

    .ship-group {
      animation: hover 4s ease-in-out infinite;
      transform-origin: 200px 150px;
    }

    .engine-flame {
      animation: flicker 0.15s ease-in-out infinite;
      transform-origin: 265px 150px;
    }

    .star {
      fill: #ffffff;
      animation: streak linear infinite;
    }
    
    .star-fast { animation-duration: 1.5s; }
    .star-medium { animation-duration: 2.5s; }
    .star-slow { animation-duration: 4s; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="10" />

  <line class="star star-fast" x1="0" y1="50" x2="40" y2="50" stroke="#fff" stroke-width="2" stroke-linecap="round" style="animation-delay: 0s;" />
  <line class="star star-medium" x1="0" y1="120" x2="25" y2="120" stroke="#7da2ff" stroke-width="1.5" stroke-linecap="round" style="animation-delay: 0.7s;" />
  <line class="star star-slow" x1="0" y1="220" x2="15" y2="220" stroke="#fff" stroke-width="1" stroke-linecap="round" style="animation-delay: 0.3s;" />
  <line class="star star-fast" x1="0" y1="270" x2="50" y2="270" stroke="#ff9ee2" stroke-width="2" stroke-linecap="round" style="animation-delay: 1.1s;" />
  <line class="star stroke-medium" x1="0" y1="80" x2="30" y2="80" stroke="#fff" stroke-width="1.5" stroke-linecap="round" style="animation-delay: 1.8s;" />

  <g class="ship-group">
    <path class="engine-flame" d="M 265 140 Q 310 150 265 160 Z" fill="#00f0ff" opacity="0.8" />
    <path class="engine-flame" d="M 265 145 Q 290 150 265 155 Z" fill="#ffffff" />

    <path d="M 265 135 C 240 120, 170 120, 130 150 C 170 180, 240 180, 265 165 Z" fill="#2c3e50" />
    
    <path d="M 180 142 C 170 145, 150 148, 145 150 C 150 152, 170 155, 180 158 C 195 155, 195 145, 180 142 Z" fill="#00f0ff" opacity="0.9" />
    
    <path d="M 210 126 L 240 100 L 255 100 L 245 130 Z" fill="#1a252f" />
    
    <path d="M 210 174 L 240 200 L 255 200 L 245 170 Z" fill="#1a252f" />
    
    <path d="M 210 132 C 230 135, 245 140, 255 145" stroke="#e74c3c" stroke-width="3" fill="none" />
    <path d="M 210 168 C 230 165, 245 160, 255 155" stroke="#e74c3c" stroke-width="3" fill="none" />
  </g>
</svg>
