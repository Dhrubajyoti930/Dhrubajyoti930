<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="1" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    :root {
      --loop-duration: 3s;
    }
    .robot-group {
      animation: robotRun var(--loop-duration) infinite linear;
    }
    .robot-body {
      animation: robotBob 0.4s infinite ease-in-out alternate;
    }
    .propeller {
      transform-origin: 35px 12px;
      animation: spin 0.1s infinite linear;
    }
    .laser-eye {
      animation: eyeBlink 1.5s infinite steps(1);
    }
    .dog-group {
      animation: dogRun var(--loop-duration) infinite linear;
    }
    .dog-body {
      animation: dogGallop 0.4s infinite ease-in-out alternate;
    }
    .dog-tail {
      transform-origin: 12px 130px;
      animation: tailWag 0.15s infinite ease-in-out alternate;
    }
    .dog-ears {
      transform-origin: 52px 105px;
      animation: earFlap 0.2s infinite ease-in-out alternate;
    }
    .dust-cloud {
      transform-origin: bottom center;
      animation: puff 0.4s infinite linear;
    }

    @keyframes robotRun {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(950px); }
    }
    @keyframes robotBob {
      0% { transform: translateY(0px) rotate(-5deg); }
      100% { transform: translateY(-12px) rotate(5deg); }
    }
    @keyframes spin {
      0% { transform: scaleX(1); }
      50% { transform: scaleX(-1); }
      100% { transform: scaleX(1); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { fill: #ff2a5f; }
      95% { fill: #30363d; }
    }
    @keyframes dogRun {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(750px); }
    }
    @keyframes dogGallop {
      0% { transform: translateY(0px) rotate(-4deg); }
      100% { transform: translateY(-18px) rotate(6deg); }
    }
    @keyframes tailWag {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes earFlap {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(15deg); }
    }
    @keyframes puff {
      0% { transform: scale(0.6) translateX(0); opacity: 0.8; }
      100% { transform: scale(1.2) translateX(-15px); opacity: 0; }
    }
  </style>

  <!-- Track Line -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="url(#floorGrad)" stroke-width="3" stroke-dasharray="5 5" />

  <!-- DOG GROUP -->
  <g class="dog-group">
    <circle class="dust-cloud" cx="28" cy="160" r="6" fill="#8b949e" opacity="0.4" />
    <circle class="dust-cloud" cx="68" cy="160" r="4" fill="#8b949e" opacity="0.3" style="animation-delay: 0.1s;" />
    <g class="dog-body">
      <path class="dog-tail" d="M12,130 Q-10,110 5,95 Q5,115 12,130" fill="#ff9e2c" />
      <ellipse cx="25" cy="148" rx="8" ry="14" fill="#e48113" transform="rotate(-20 25 148)" />
      <ellipse cx="38" cy="148" rx="7" ry="15" fill="#ff9e2c" transform="rotate(15 38 148)" />
      <ellipse cx="50" cy="125" rx="35" ry="22" fill="#ff9e2c" />
      <path d="M65,110 Q80,125 65,143 Q55,130 65,110" fill="#ffffff" />
      <ellipse cx="68" cy="146" rx="7" ry="16" fill="#e48113" transform="rotate(-30 68 146)" />
      <ellipse cx="78" cy="144" rx="7" ry="15" fill="#ff9e2c" transform="rotate(25 78 144)" />
      <path d="M68,112 L82,90 L95,102 L78,122 Z" fill="#ff9e2c" />
      <polygon points="78,94 84,88 91,95 85,101" fill="#ff2a5f" />
      <ellipse cx="98" cy="85" rx="18" ry="16" fill="#ff9e2c" />
      <path d="M108,82 Q125,82 120,94 L104,96 Z" fill="#ff9e2c" />
      <path d="M106,91 L116,92 L105,96 Z" fill="#ff2a5f" />
      <circle cx="120" cy="84" r="3.5" fill="#21262d" />
      <circle cx="98" cy="78" r="3" fill="#21262d" />
      <circle cx="99" cy="77" r="1" fill="#ffffff" />
      <path class="dog-ears" d="M85,78 Q70,75 75,100 Q88,95 85,78" fill="#e48113" />
    </g>
  </g>

  <!-- ROBOT DRONE GROUP -->
  <g class="robot-group">
    <g class="robot-body">
      <line x1="35" y1="35" x2="35" y2="20" stroke="#58a6ff" stroke-width="3" />
      <circle cx="35" cy="17" r="4" fill="#58a6ff" />
      <path class="propeller" d="M10,12 L60,12" stroke="#8b949e" stroke-width="3" stroke-linecap="round" />
      <line x1="35" y1="12" x2="35" y2="35" stroke="#8b949e" stroke-width="4" />
      <path d="M10,50 L-5,48 L10,46 Z" fill="#ff9e2c" opacity="0.6" />
      <rect x="15" y="35" width="40" height="30" rx="8" fill="#6e7681" stroke="#21262d" stroke-width="2" />
      <rect x="20" y="40" width="30" height="12" rx="3" fill="#8b949e" />
      <circle class="laser-eye" cx="42" cy="46" r="5" fill="#ff2a5f" />
      <path d="M45,55 Q58,55 52,65" fill="none" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
      <polygon points="50,63 56,67 50,70" fill="#8b949e" />
    </g>
  </g>
</svg>
