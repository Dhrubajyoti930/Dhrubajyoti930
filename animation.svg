<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <style>
    .bg { fill: #0b0f19; }
    .circle { fill: none; stroke: rgba(255, 255, 255, 0.4); stroke-width: 1px; }
    .vector { fill: none; stroke: #00f0ff; stroke-width: 2px; }
    .tracer { fill: #fff; }
    .trail { fill: none; stroke: #fff; stroke-width: 1.5px; opacity: 0.8; }
    .label { fill: #7da2ff; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes tracerFade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Chain Animation Times (Frequencies) */
    .r-1 { animation: rotate 12s linear infinite; transform-origin: 150px 200px; }
    .r-3 { animation: rotate 4s linear infinite; transform-origin: calc(150px + 60px) 200px; }
    .r-5 { animation: rotate 2.4s linear infinite; transform-origin: calc(150px + 60px + 20px) 200px; }
    .r-7 { animation: rotate 1.71s linear infinite; transform-origin: calc(150px + 60px + 20px + 8.57px) 200px; }
    
    .c2-origin { transform: translate(60px, 0); }
    .c3-origin { transform: translate(20px, 0); }
    .c4-origin { transform: translate(8.57px, 0); }
    .tracer-pulse { animation: tracerFade 2s ease-in-out infinite; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="10" />

  <text x="15" y="30" class="label" fill="#fff" text-anchor="start" font-size="16px">Fourier Analysis &amp; Algorithmic Art</text>
  <text x="15" y="55" class="label" font-size="12px" text-anchor="start">f(t) ≈ Σ (Am sin(mωt) + Bm cos(mωt))</text>

  <text x="150" y="280" class="label">Term 1</text>
  <text x="210" y="280" class="label">Term 3</text>
  <text x="230" y="280" class="label">Term 5</text>
  <text x="238.57" y="280" class="label">Term 7</text>
  
  <circle class="tracer tracer-pulse" cx="150" cy="200" r="4">
    <animate attributeName="cx" dur="12s" values="600; 150" keyTimes="0; 1" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="cy" dur="12s" values="320; 200" keyTimes="0; 1" repeatCount="indefinite" additive="sum"/>
  </circle>
  <path class="trail" d="M150 200 C 180 220, 220 180, 250 200 S 300 240, 350 200 S 400 160, 450 200 S 500 240, 550 200 S 600 160, 650 200" style="opacity:0.3; stroke:#fff; stroke-width:0.5px;" />

  <g class="r-1">
    <circle class="circle" cx="150" cy="200" r="60" />
    <line class="vector" x1="150" y1="200" x2="210" y2="200" />
    
    <g class="c2-origin r-3">
      <circle class="circle" cx="150" cy="200" r="20" stroke="rgba(231, 76, 60, 0.5)"/>
      <line class="vector" x1="150" y1="200" x2="170" y2="200" stroke="#e74c3c"/>

      <g class="c3-origin r-5">
        <circle class="circle" cx="150" cy="200" r="8.57" stroke="rgba(46, 204, 113, 0.5)"/>
        <line class="vector" x1="150" y1="200" x2="158.57" y2="200" stroke="#2ecc71"/>

        <g class="c4-origin r-7">
          <circle class="circle" cx="150" cy="200" r="4.28" stroke="rgba(155, 89, 182, 0.5)"/>
          <line class="vector" x1="150" y1="200" x2="154.28" y2="200" stroke="#9b59b6"/>
          
          </g>
      </g>
    </g>
  </g>
  
  <text x="400" y="380" class="label" fill="#fff">n=1, n=3, n=5, n=7</text>
  <text x="400" y="395" class="label" font-size="11px">Dynamic Fourier Series Epicycle Generator for a Square Wave Approximation</text>

</svg>
