<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0" />
    </linearGradient>

    <g id="fractal-tree">
      <path d="M0,0 L0,-40" stroke="#6e7681" stroke-width="4" stroke-linecap="round"/>
      <path d="M0,-40 L-25,-75 M0,-40 L25,-75" stroke="#6e7681" stroke-width="3" stroke-linecap="round"/>
      <path d="M-25,-75 L-45,-105 M-25,-75 L-10,-110 M25,-75 L10,-110 M25,-75 L45,-105" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
      <path d="M-45,-105 L-55,-125 M-45,-105 L-35,-125 M-10,-110 L-20,-130 M-10,-110 L0,-130 M10,-110 L0,-130 M10,-110 L20,-130 M45,-105 L35,-125 M45,-105 L55,-125" stroke="#8b949e" stroke-width="1" stroke-linecap="round"/>
      <circle cx="-55" cy="-125" r="3" fill="#58a6ff" class="glow-node"/>
      <circle cx="-35" cy="-125" r="2.5" fill="#ff9e2c" class="glow-node"/>
      <circle cx="-20" cy="-130" r="3" fill="#58a6ff" class="glow-node"/>
      <circle cx="0" cy="-130" r="2" fill="#ff9e2c" class="glow-node"/>
      <circle cx="20" cy="-130" r="3" fill="#58a6ff" class="glow-node"/>
      <circle cx="35" cy="-125" r="2.5" fill="#ff9e2c" class="glow-node"/>
      <circle cx="55" cy="-125" r="3" fill="#58a6ff" class="glow-node"/>
    </g>

    <g id="butterfly">
      <g class="wing-beat">
        <path d="M0,0 Q-10,-15 -15,-5 Q-20,10 0,10 Z" fill="#e48113" opacity="0.85"/>
        <path d="M0,0 Q10,-15 15,-5 Q20,10 0,10 Z" fill="#ff9e2c" opacity="0.85"/>
      </g>
    </g>
  </defs>

  <style>
    :root {
      --loop-duration: 4.5s;
    }

    /* Environmental Time Cycle */
    .sky-bg {
      animation: timeCycle 40s infinite linear;
    }
    .stars {
      animation: starFade 40s infinite linear;
    }

    @keyframes timeCycle {
      0%, 100% { fill: #090c10; } /* Night */
      25% { fill: #1f2a3d; } /* Dawn */
      50% { fill: #2c3e50; } /* Day */
      75% { fill: #1f2a3d; } /* Dusk */
    }
    @keyframes starFade {
      0%, 10% { opacity: 1; }
      25%, 75% { opacity: 0; }
      90%, 100% { opacity: 1; }
    }
    .glow-node {
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Parallax Background Movement */
    .parallax-slow { animation: scrollLeft 25s infinite linear; }
    .parallax-mid { animation: scrollLeft 15s infinite linear; }
    
    @keyframes scrollLeft {
      0% { transform: translateX(1100px); }
      100% { transform: translateX(-400px); }
    }

    /* Butterfly Animations */
    .fly-path-1 { animation: flutterAcross 12s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95); }
    .fly-path-2 { animation: flutterAcross 17s infinite cubic-bezier(0.25, 0.1, 0.25, 1) 4s; }
    
    @keyframes flutterAcross {
      0% { transform: translate(-100px, 200px) scale(0.6) rotate(10deg); }
      25% { transform: translate(250px, 120px) scale(0.7) rotate(-15deg); }
      50% { transform: translate(600px, 180px) scale(0.6) rotate(20deg); }
      75% { transform: translate(850px, 100px) scale(0.7) rotate(-10deg); }
      100% { transform: translate(1200px, 150px) scale(0.6) rotate(15deg); }
    }
    
    .wing-beat {
      animation: flap 0.15s infinite alternate ease-in-out;
      transform-origin: center;
    }
    @keyframes flap {
      0% { transform: scaleX(1); }
      100% { transform: scaleX(0.1); }
    }

    /* Runner Animations - Smoothed */
    .runner-group {
      animation: runLoop var(--loop-duration) infinite linear;
    }
    .bob {
      animation: runBob 0.35s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94) alternate;
    }
    .shadow {
      animation: shadowPulse 0.35s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94) alternate;
      transform-origin: center;
    }

    .leg-1-1 { --tx: 140px; --ty: 205px; animation: legSwing1 0.35s infinite cubic-bezier(0.4, 0.0, 0.2, 1) alternate; }
    .leg-1-2 { --tx: 180px; --ty: 205px; animation: legSwing2 0.35s infinite cubic-bezier(0.4, 0.0, 0.2, 1) alternate; animation-delay: 0.175s; }
    .leg-2-1 { --tx: 420px; --ty: 180px; animation: legSwing1 0.35s infinite cubic-bezier(0.4, 0.0, 0.2, 1) alternate; }
    .leg-2-2 { --tx: 460px; --ty: 180px; animation: legSwing2 0.35s infinite cubic-bezier(0.4, 0.0, 0.2, 1) alternate; animation-delay: 0.175s; }

    @keyframes runLoop {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes runBob {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-18px); }
    }
    @keyframes shadowPulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(0.6); opacity: 0.3; }
    }
    
    @keyframes legSwing1 {
      0% { transform: translate(var(--tx), var(--ty)) rotate(-20deg); }
      100% { transform: translate(var(--tx), var(--ty)) rotate(25deg); }
    }
    @keyframes legSwing2 {
      0% { transform: translate(var(--tx), var(--ty)) rotate(25deg); }
      100% { transform: translate(var(--tx), var(--ty)) rotate(-20deg); }
    }
  </style>

  <rect class="sky-bg" width="100%" height="100%" />

  <g class="stars" fill="#fff" opacity="0.8">
    <circle cx="150" cy="50" r="1.5" />
    <circle cx="320" cy="90" r="1" />
    <circle cx="500" cy="40" r="2" />
    <circle cx="750" cy="80" r="1.5" />
    <circle cx="890" cy="30" r="1" />
  </g>

  <g class="parallax-slow" opacity="0.4">
    <use href="#fractal-tree" x="100" y="240" transform="scale(0.6)" />
    <use href="#fractal-tree" x="400" y="250" transform="scale(0.5)" />
    <use href="#fractal-tree" x="700" y="245" transform="scale(0.7)" />
  </g>

  <g class="parallax-mid" opacity="0.7">
    <use href="#fractal-tree" x="250" y="250" transform="scale(0.85)" />
    <use href="#fractal-tree" x="650" y="260" transform="scale(0.9)" />
  </g>

  <line x1="0" y1="250" x2="1000" y2="250" stroke="url(#groundGrad)" stroke-width="4" stroke-dasharray="12 12" />

  <g class="runner-group" style="animation-delay: -0.2s;">
    <ellipse cx="160" cy="255" rx="35" ry="6" fill="#000" class="shadow" style="animation-delay: -0.1s;" />
    
    <g class="bob" style="animation-delay: -0.1s;">
      <g class="leg-1-1"><ellipse cx="0" cy="20" rx="10" ry="32" fill="#e48113" /></g>
      <g class="leg-1-2"><ellipse cx="0" cy="20" rx="10" ry="32" fill="#e48113" /></g>
      
      <ellipse cx="160" cy="180" rx="42" ry="32" fill="#ff9e2c" />
      <circle cx="160" cy="180" r="15" fill="#30363d" />
      <circle cx="160" cy="180" r="10" fill="#21262d" />
      <path d="M150,170 Q160,180 170,170" fill="none" stroke="#8b949e" stroke-width="2.5" />
      
      <ellipse cx="215" cy="145" rx="22" ry="18" fill="#ff9e2c" />
      <path d="M215,127 Q225,115 235,130" fill="none" stroke="#21262d" stroke-width="3" /> 
      <circle cx="220" cy="145" r="7" fill="#30363d" /> 
      <circle cx="222" cy="143" r="2.5" fill="#58a6ff" /> 
    </g>
  </g>

  <g class="runner-group" style="animation-delay: 0.3s;">
    <ellipse cx="440" cy="255" rx="40" ry="7" fill="#000" class="shadow" style="animation-delay: 0.1s;" />
    
    <g class="bob" style="animation-delay: 0.1s;">
      <g class="leg-2-1"><ellipse cx="0" cy="20" rx="11" ry="37" fill="#8b949e" /></g>
      <g class="leg-2-2"><ellipse cx="0" cy="20" rx="11" ry="37" fill="#8b949e" /></g>
      
      <ellipse cx="440" cy="130" rx="48" ry="38" fill="#6e7681" />
      <ellipse cx="495" cy="130" rx="12" ry="26" fill="#8b949e" />
      <ellipse cx="440" cy="130" rx="38" ry="27" fill="#30363d" />
      <path d="M415,110 Q440,120 465,110" fill="none" stroke="#8b949e" stroke-width="2.5" />
      <path d="M415,150 Q440,140 465,150" fill="none" stroke="#8b949e" stroke-width="2.5" />
      
      <ellipse cx="440" cy="75" rx="20" ry="24" fill="#6e7681" />
      <circle cx="440" cy="75" r="11" fill="#30363d" /> 
      <circle cx="440" cy="75" r="4.5" fill="#58a6ff" /> 
      <line x1="440" y1="51" x2="440" y2="30" stroke="#8b949e" stroke-width="3" stroke-linecap="round" /> 
      <circle cx="440" cy="26" r="4" fill="#ff9e2c" class="glow-node"/>
    </g>
  </g>

  <g class="fly-path-1"><use href="#butterfly" /></g>
  <g class="fly-path-2"><use href="#butterfly" /></g>
</svg>
