<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="60%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <radialGradient id="nebulaOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e48113" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#e48113" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="thrustOrange" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9e2c" stop-opacity="0" />
      <stop offset="50%" stop-color="#e48113" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="thrustBlue" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="60%" stop-color="#388bfd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <line id="star-streak" x1="0" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-linecap="round" />
  </defs>

  <style>
    /* Starfield Warp Speed Parallax */
    .stars-fast { animation: warpSpeed 1s infinite linear; opacity: 0.9; }
    .stars-mid { animation: warpSpeed 2s infinite linear; opacity: 0.6; }
    .stars-slow { animation: warpSpeed 4.5s infinite linear; opacity: 0.3; }

    @keyframes warpSpeed {
      0% { transform: translateX(1100px); }
      100% { transform: translateX(-100px); }
    }

    /* Ship Hover / Flight Turbulence */
    .ship-orange {
      animation: flightFloat 3.5s infinite ease-in-out;
    }
    .ship-grey {
      animation: flightFloat 4s infinite ease-in-out;
      animation-delay: -1.5s;
    }

    @keyframes flightFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(5px, -10px) rotate(1deg); }
    }

    /* Plasma Engine Flicker */
    .exhaust {
      animation: engineFlicker 0.15s infinite alternate ease-in-out;
      transform-origin: right center;
    }

    @keyframes engineFlicker {
      0% { transform: scaleY(0.85) scaleX(0.95); opacity: 0.7; }
      100% { transform: scaleY(1.1) scaleX(1.15); opacity: 1; }
    }

    /* Subtle Cosmic Beacon Blinks */
    .beacon { animation: blink 1.5s infinite alternate ease-in-out; }
    @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>

  <rect width="100%" height="100%" fill="url(#spaceBg)" />

  <circle cx="300" cy="100" r="250" fill="url(#nebulaOrange)" />
  <circle cx="750" cy="200" r="300" fill="url(#nebulaBlue)" />

  <g class="stars-slow">
    <use href="#star-streak" x="100" y="40" stroke-width="0.7" stroke-dasharray="20 40" />
    <use href="#star-streak" x="500" y="120" stroke-width="0.5" stroke-dasharray="10 30" />
    <use href="#star-streak" x="800" y="260" stroke-width="0.6" stroke-dasharray="15 25" />
    <use href="#star-streak" x="300" y="220" stroke-width="0.4" stroke-dasharray="5 45" />
  </g>

  <g class="stars-mid">
    <use href="#star-streak" x="200" y="80" stroke-width="1.2" stroke-dasharray="40 40" />
    <use href="#star-streak" x="700" y="30" stroke-width="1" stroke-dasharray="30 50" />
    <use href="#star-streak" x="450" y="270" stroke-width="1.5" stroke-dasharray="50 30" />
    <use href="#star-streak" x="900" y="170" stroke-width="0.9" stroke-dasharray="25 35" />
  </g>

  <g class="stars-fast">
    <use href="#star-streak" x="50" y="190" stroke-width="2.5" stroke-dasharray="80 20" />
    <use href="#star-streak" x="600" y="90" stroke-width="2" stroke-dasharray="70 40" />
    <use href="#star-streak" x="350" y="150" stroke-width="1.8" stroke-dasharray="60 30" />
  </g>

  <g transform="translate(180, 80)" class="ship-orange">
    <path d="M-10,35 L-70,25 L-40,35 L-70,45 Z" fill="url(#thrustOrange)" class="exhaust" />
    
    <path d="M10,20 L-20,0 L0,35 L90,35 Z" fill="#21262d" />
    <path d="M10,50 L-20,70 L0,35 L90,35 Z" fill="#21262d" />
    
    <path d="M-15,25 L10,15 L70,25 L100,35 L70,45 L10,55 L-15,45 Z" fill="#e48113" />
    <path d="M15,20 L55,26 L75,35 L55,44 L15,50 L5,35 Z" fill="#ff9e2c" />
    
    <polygon points="35,30 60,32 65,35 60,38 35,40 42,35" fill="#30363d" />
    <polygon points="45,32 58,33 60,35 58,37 45,38 49,35" fill="#58a6ff" />
    
    <line x1="0" y1="10" x2="40" y2="10" stroke="#6e7681" stroke-width="2" />
    <line x1="0" y1="60" x2="40" y2="60" stroke="#6e7681" stroke-width="2" />
  </g>


  <g transform="translate(520, 140)" class="ship-grey">
    <path d="M-5,22 L-85,12 L-45,25 L-85,38 Z" fill="url(#thrustBlue)" class="exhaust" />
    <path d="M-5,48 L-85,38 L-45,51 L-85,64 Z" fill="url(#thrustBlue)" class="exhaust" style="animation-delay: -0.07s;" />

    <path d="M0,15 L30,5 L110,20 L130,35 L110,50 L30,65 L0,55 Z" fill="#30363d" />
    <path d="M10,20 L40,12 L105,25 L125,35 L105,45 L40,58 L10,50 Z" fill="#6e7681" />
    <path d="M25,25 L45,18 L90,28 L105,35 L90,42 L45,52 L25,45 Z" fill="#8b949e" />

    <rect x="50" y="30" width="25" height="10" rx="3" fill="#21262d" />
    <ellipse cx="62" cy="35" rx="8" ry="3" fill="#58a6ff" />
    <circle cx="62" cy="35" r="2" fill="#ff9e2c" class="beacon" />

    <path d="M110,27 L125,35 L110,43 Z" fill="#21262d" />
  </g>
</svg>
